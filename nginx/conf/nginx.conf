# =============================================================================
#  MDS projekt 2026/27 - centralny multimedialny server (nginx + nginx-rtmp)
#
#  Tok videa:
#    OBS  --RTMP-->  rtmp://127.0.0.1/obs/program        (iba pre OBS)
#    ffmpeg (support-scripts/transcode.bat) si stream vytiahne z app "obs",
#    prekoduje ho do 3 kvalit a posle spat do app "hls":
#           rtmp://127.0.0.1/hls/program_1080
#           rtmp://127.0.0.1/hls/program_720
#           rtmp://127.0.0.1/hls/program_480
#    nginx z nich vyrobi HLS fragmenty + adaptivny master playlist:
#           https://<server>/hls/program.m3u8
#
#  Web:
#    https://<server>/          stranka divaka (site/index.html)
#    https://<server>/hls/...   HLS playlisty a fragmenty
#    https://<server>:8443/     webove rozhranie rezisera (proxy na Flask :5000)
#    http://...                 presmerovane na https
#
#  nginx sa musi spustat z tohto priecinka (start-nginx.bat), vsetky relativne
#  cesty (logs, temp, site, conf/ssl) su relativne k nemu.
# =============================================================================

daemon              off;
master_process      off;
worker_processes    1;

error_log  logs/error.log;

events {
    worker_connections  1024;
}

# -----------------------------------------------------------------------------
#  RTMP
# -----------------------------------------------------------------------------
# https://github.com/arut/nginx-rtmp-module/wiki/Directives
rtmp {
    server {
        listen      1935;
        chunk_size  4096;

        # Vstup z centralneho OBS. Specificky endpoint, ktory sa na nic ine
        # nepouziva. Publikovat (OBS) aj citat (ffmpeg transkoder) sa da iba
        # z lokalneho stroja.
        application obs {
            live on;
            record off;

            # Ked OBS prestane vysielat, odpoj aj ffmpeg -> transkoder sa
            # restartuje a pocka na dalsie vysielanie.
            idle_streams off;

            # Novemu odberatelovi (ffmpeg) posielaj data az od klucoveho snimku
            # videa - inak ffmpeg pri pripojeni do beziaceho streamu vidi najprv
            # iba audio a video stopu nenajde.
            wait_key   on;
            wait_video on;

            allow publish 127.0.0.1;
            deny  publish all;
            allow play    127.0.0.1;
            deny  play    all;
        }

        # Kvalitativne varianty z ffmpeg -> HLS. Cez RTMP sa odtialto
        # neprehrava, divaci dostanu iba HLS cez HTTPS.
        application hls {
            live on;
            record off;

            allow publish 127.0.0.1;
            deny  publish all;
            deny  play    all;

            hls                  on;
            hls_path             temp/tmp_hls;
            hls_nested           on;          # temp/tmp_hls/program_720/index.m3u8
            hls_fragment         2s;          # = GOP 2 s v transcode.bat
            hls_playlist_length  12s;
            hls_cleanup          on;
            hls_continuous       on;
            hls_fragment_naming  sequential;

            # Adaptivny master playlist temp/tmp_hls/program.m3u8
            # BANDWIDTH = video + audio bitrate v bit/s (musi sediet s transcode.bat)
            hls_variant _1080  BANDWIDTH=5800000,RESOLUTION=1920x1080;
            hls_variant _720   BANDWIDTH=3100000,RESOLUTION=1280x720;
            hls_variant _480   BANDWIDTH=1400000,RESOLUTION=854x480;
        }
    }
}

# -----------------------------------------------------------------------------
#  HTTP / HTTPS
# -----------------------------------------------------------------------------
http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           off;   # na Windows spolahlivejsie pri subore, ktory sa prave zapisuje
    keepalive_timeout  65;

    access_log  logs/access.log;

    # Connection hlavicka pre proxy (WebSocket upgrade iba ked ho klient chce)
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # Spolocne TLS nastavenia (self-signed certifikat, vid support-scripts/gen-cert.*)
    ssl_certificate      ssl/cert.pem;
    ssl_certificate_key  ssl/key.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;

    # HTTP -> HTTPS
    server {
        listen       80;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    # Stranka divaka + HLS
    server {
        listen       443 ssl;
        server_name  _;

        root   site;
        index  index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # HLS playlisty a fragmenty generovane nginx-rtmp
        location /hls/ {
            alias temp/tmp_hls/;

            types {
                application/vnd.apple.mpegurl  m3u8;
                video/mp2t                     ts;
            }

            # Playlisty sa menia kazde 2 s, nesmu sa cachovat.
            add_header Cache-Control "no-cache, no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Date, Last-Modified" always;
        }

        # Statistiky RTMP servera (iba z lokalneho stroja)
        location /stats {
            allow 127.0.0.1;
            deny  all;
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Refresh "3; $request_uri";
        }
    }

    # Webove rozhranie rezisera (Flask na 127.0.0.1:5000) cez HTTPS.
    # Flask aplikacia sa nemeni, nginx iba prida TLS.
    server {
        listen       8443 ssl;
        server_name  _;

        client_max_body_size  10m;

        location / {
            proxy_pass          http://127.0.0.1:5000;
            proxy_http_version  1.1;
            proxy_set_header    Host               $http_host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  https;
            proxy_set_header    Upgrade            $http_upgrade;
            proxy_set_header    Connection         $connection_upgrade;
            proxy_read_timeout  300s;
        }
    }
}
