<!doctype html>
<html lang="sk" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0f12">
  <title>MDS Live</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video-js.min.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <header class="site-header">
    <div class="container-xl d-flex align-items-center gap-3 py-3">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>MDS&nbsp;Live</span>
      </a>
      <span id="status-badge" class="status-badge status-waiting ms-auto" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Offline</span>
      </span>
    </div>
  </header>

  <main class="container-xl pb-5">
    <section class="stage" aria-label="Prehrávač">

      <!-- Zobrazené, kým HLS stream nie je aktívny -->
      <div id="waiting" class="waiting">
        <div class="waiting-inner">
          <div class="signal" aria-hidden="true"><span></span><span></span><span></span></div>
          <h1 class="h3 mb-2">Čakáme na začiatok vysielania</h1>
          <p class="text-body-secondary mb-0">
            Prehrávač sa zobrazí sám, len čo vysielanie začne. Stránku nemusíte obnovovať.
          </p>
          <p class="small text-body-tertiary mt-3 mb-0">
            Posledná kontrola: <span id="last-check">–</span>
          </p>
        </div>
      </div>

      <!-- Zobrazené počas vysielania -->
      <div id="player-wrap" class="player-wrap" hidden>
        <video id="player" class="video-js vjs-big-play-centered"
               playsinline controls preload="auto"></video>
      </div>
    </section>

    <section id="info" class="info-bar" hidden>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="text-body-secondary small me-1">Kvalita</span>
        <div id="quality-group" class="btn-group btn-group-sm flex-wrap" role="group" aria-label="Výber kvality"></div>
        <span id="quality-now" class="small text-body-secondary ms-sm-auto"></span>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container-xl small text-body-tertiary py-3">
      Multimediálne služby 2026/27 · HLS adaptívny stream
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video.min.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
